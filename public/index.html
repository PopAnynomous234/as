  <style>
        :root {
            --accent: #26ff9a;
            --bg-dark: #0f1113;
            --surface: #1e1f22;
            --toolbar: #2b2d31;
            --text: #e0e0e0;
            --text-dim: #888;
            --tab-width: 180px;
        }
  .home-screen {
    /* Combined: The gradient (top layer) and the Image (bottom layer) */
    background: radial-gradient(circle at center, rgba(26, 28, 30, 0.4) 0%, rgba(15, 17, 19, 0.9) 100%),
                url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdOewc3ACIQP0iJOGfMCaFkqZTlUJV9-PW6Q&s');
   
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
   
    /* Layout */
    height: 100%;
    width:100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

        .home-screen h1 { font-size: 48px; margin-bottom: 30px; letter-spacing: -2px; }
.home-screen h3 {
   color:#26ff9a;
   
}
.home-screen img {
   width: 150px;
   height: 150px;
   /* A 1.2s total cycle (0.6s up, 0.6s down) works well for visibility */
   animation: up-down-trail 2s ease-in-out infinite;
}

@keyframes up-down-trail {
  /* 1. START AT BOTTOM: Moving UP */
  0% {
    transform: translateY(0);
    filter: drop-shadow(0 5px 2px #26ff9A); /* Trail starts behind (at bottom) */
  }

  /* 2. MID-WAY UP: Peak speed upward */
  25% {
    filter: drop-shadow(0 25px 10px #26ff9A); /* Long trail at bottom */
  }

  /* 3. AT TOP: Switching directions */
  50% {
    transform: translateY(-50px);
    filter: drop-shadow(0 0 5px #26ff9A); /* Trail resets as direction changes */
  }

  /* 4. MID-WAY DOWN: Peak speed downward */
  75% {
    filter: drop-shadow(0 -25px 10px #26ff9A); /* Long trail at TOP */
  }

  /* 5. BACK AT BOTTOM */
  100% {
    transform: translateY(0);
    filter: drop-shadow(0 5px 2px #26ff9A);
  }
}


        .home-screen h1 span { color: var(--accent); }
        .bookmarks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; max-width: 600px; }
        .bookmark {
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            transition: transform 0.2s;
        }
        .bookmark:hover { transform: translateY(-5px); }
        .icon-box {
            width: 64px; height: 64px; background: var(--surface); border-radius: 16px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            border: 1px solid rgba(255,255,255,0.05); color: var(--accent);
        }
        .bookmark span { font-size: 12px; font-weight: 500; color: var(--text-dim); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
   
      @keyframes up-down-trail {
  /* 1. START AT BOTTOM: Moving UP */
  0% {
    transform: translateY(0);
    filter: drop-shadow(0 5px 2px #26ff9A); /* Trail starts behind (at bottom) */
  }

  /* 2. MID-WAY UP: Peak speed upward */
  25% {
    filter: drop-shadow(0 25px 10px #26ff9A); /* Long trail at bottom */
  }

  /* 3. AT TOP: Switching directions */
  50% {

    filter: drop-shadow(0 0 5px #26ff9A); /* Trail resets as direction changes */
  }

  /* 4. MID-WAY DOWN: Peak speed downward */

  /* 5. BACK AT BOTTOM */

#nav-inspect {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 16px;
}

#nav-inspect:hover {
    color: var(--accent); /* #26ff9a */
    text-shadow: 0 0 10px var(--accent);
}

/* Ensure the form doesn't squash the buttons */
#sj-form {
    display: flex;
    align-items: center;
}

.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
}
.modal-content {
    background: var(--surface); border: 1px solid var(--accent);
    padding: 20px; border-radius: 12px; width: 350px;
    box-shadow: 0 0 20px rgba(38, 255, 154, 0.2);
}
.modal-content h3 { color: var(--accent); margin-top: 0; }
.modal-content input {
    width: 100%; background: #000; border: 1px solid #333;
    color: white; padding: 8px; margin: 10px 0; border-radius: 4px;
}
.modal-content input:focus { border-color: var(--accent); outline: none; }
#bm-save { background: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
#bm-cancel { background: transparent; color: white; border: none; margin-right: 10px; cursor: pointer; }

/* The Navigation Button */
#nav-add-bookmark {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#nav-add-bookmark:hover {
    color: var(--accent); /* #26ff9a */
    transform: scale(1.1);
    filter: drop-shadow(0 0 8px var(--accent));
}

/* Modal Styling Enhancements */
.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

/* Modal Buttons */
#bm-save {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
}

#bm-save:hover {
    opacity: 0.9;
    box-shadow: 0 0 15px rgba(38, 255, 154, 0.4);
}

#bm-cancel {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
}

#bm-cancel:hover {
    background: rgba(255, 255, 255, 0.1);
}

/* The Bookmark Items in the bar */
.bookmark-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: var(--surface);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    max-width: 150px;
}

.bookmark-item:hover {
    border-color: var(--accent);
    background: rgba(38, 255, 154, 0.05);
}

.bookmark-icon {
    width: 16px;
    height: 16px;
    pointer-events: none;
}

.bookmark-item span {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
}
  </style>
